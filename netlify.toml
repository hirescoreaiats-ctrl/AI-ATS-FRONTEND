[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/pipeline"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/candidates"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/talent-search"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/inbox"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/copilot"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/analytics"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/jobs"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/organization"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
